<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Birthday Mission #02 🕷️</title>
<link href="https://fonts.googleapis.com/css2?family=Geom:ital,wght@0,300..900;1,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 

    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="balloons.css">
</head>

<body class="balloon-page">

    <main class="balloon-container">

        <div class="mission-label">
            🕷️ BIRTHDAY MISSION #02
        </div>

        <h1>
            THE CAKE IS READY...
            <span>BUT SOMETHING IS MISSING 🎈</span>
        </h1>

        <p class="balloon-subtitle">
            Pop the balloons and find out what's waiting for you. 👀
        </p>

        <div class="balloon-area">

            <div class="balloon balloon-red" data-message="You're annoying. 😌"></div>

            <div class="balloon balloon-blue" data-message="But you're still my favourite person. ❤️"></div>

            <div class="balloon balloon-pink" data-message="Okay fine... you're cute. 🙄💕"></div>

            <div class="balloon balloon-yellow" data-message="Don't get too excited. 😭"></div>

            <div class="balloon balloon-purple" data-message="One more balloon... 👀"></div>

        </div>

        <div id="balloonMessage" class="balloon-message">
            POP THE BALLOONS 🎈
        </div>

        <button id="continueButton" class="continue-button hidden">
            OPEN YOUR BIRTHDAY SURPRISE 🎁
        </button>

    </main>

    <script src="balloons.js"></script>

</body>
</html>
