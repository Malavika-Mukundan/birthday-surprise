<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Little Surprise ❤️</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geom:ital,wght@0,300..900;1,300..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet"> 

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Floating background decorations -->
    <!-- Cute floating background decorations -->

<div class="floating-heart heart1">♥</div>
<div class="floating-heart heart2">♥</div>
<div class="floating-heart heart3">♥</div>
<div class="floating-heart heart4">♥</div>

<div class="spider-mask mask1">🕷️</div>
<div class="spider-mask mask2">🕷️</div>
<div class="spider-mask mask3">🕷️</div>
<div class="spider-mask mask4">🕷️</div>
<div class="spider-mask mask5">🕷️</div>

<!-- Cute Spider-Man decorations -->

<img src="assets/spidey1.png" class="spidey spidey1" alt="">
<img src="assets/spidey3.png" class="spidey spidey3" alt="">
<img src="assets/spidey4.png" class="spidey spidey4" alt="">


<div class="web web1">✦</div>
<div class="web web2">✦</div>
    <main class="container">
 
        <div class="card">


            <p class="small-text">Got Something For You!</p>

            <h1>Hey , Birthday Boy !</h1>

            <p class="description">
                Someone has prepared a tiny surprise for you.
                <br>
                BUT FIRST
                <br>
                You need to prove you're actually him. 
            </p>

            <div class="lock">🔐</div>

            <h2>Enter the secret password</h2>

            <p class="hint">
                Hint : Enter the date you were evicted from the womb 👶🏻
            </p>

            <input
                type="text"
                id="password"
                placeholder="DD / MM / YYYY"
                maxlength="10"
            >

            <button onclick="checkPassword()">
                TIME TO UNLOCKKKK 
            </button>

            <p id="message"></p>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
